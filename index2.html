<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan Osborn Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an engineering drawing sheet. Thin ruled frames, a title block
   for each project's metadata, and red "redline" markup for anything unfinished. */
:root {
  --paper: #f1f4f7;      /* page background, cool drafting vellum */
  --sheet: #ffffff;      /* cards and panels */
  --ink: #15212c;        /* main text */
  --muted: #586675;      /* secondary text */
  --line: #c6cfd8;       /* rules and frames */
  --accent: #1d4ed8;     /* links and highlights */
  --redline: #c8102e;    /* unfinished items */
  --redline-bg: #fde8eb;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1a28; --sheet: #142438; --ink: #e6edf4; --muted: #9bafc2;
    --line: #2d4359; --accent: #86b4ff; --redline: #ff8b95; --redline-bg: #3a1a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1a28; --sheet: #142438; --ink: #e6edf4; --muted: #9bafc2;
  --line: #2d4359; --accent: #86b4ff; --redline: #ff8b95; --redline-bg: #3a1a22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 17px/1.6 var(--font-body);
}
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Draft banner */
.draft { background: var(--redline-bg); color: var(--redline); border-bottom: 1px solid var(--redline);
  font: 500 13px/1.4 var(--font-mono); padding: 8px 20px; text-align: center; }
mark.redline { background: var(--redline-bg); color: var(--redline); border-bottom: 1px dashed var(--redline);
  padding: 0 4px; font-family: var(--font-mono); font-size: .86em; }

/* Top bar */
.top { border-bottom: 1px solid var(--line); background: var(--paper); }
.top .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; padding-top: 14px; padding-bottom: 14px; }
.brand { font: 600 22px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.nav { display: flex; flex-wrap: wrap; gap: 4px 20px; font: 500 13px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.nav a { color: var(--muted); text-decoration: none; padding: 6px 0; }
.nav a:hover { color: var(--accent); }

/* Intro */
.intro { padding: 56px 0 44px; display: grid; gap: 20px; }
.eyebrow { font: 500 13px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.intro h1 { font-size: clamp(48px, 9vw, 92px); font-weight: 700; text-transform: uppercase; }
.intro .lede { max-width: 62ch; font-size: 19px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-block; font: 500 14px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase;
  padding: 12px 16px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; background: var(--sheet); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary:hover { background: var(--accent); color: var(--sheet); }
.btn.todo { border: 1px dashed var(--redline); color: var(--redline); background: var(--redline-bg); }

/* Sections */
section { padding: 40px 0; border-top: 1px solid var(--line); }
.sec-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
.sec-head h2 { font-size: 36px; font-weight: 600; text-transform: uppercase; }
.sec-head span { font: 400 13px/1.3 var(--font-mono); color: var(--muted); }

/* Figures and photo placeholders */
.fig { margin: 0; }
.fig .frame { aspect-ratio: 4 / 3; border: 1px solid var(--line); background: var(--sheet); overflow: hidden; position: relative; }
.fig img { width: 100%; height: 100%; object-fit: cover; }
.fig .ph { display: none; position: absolute; inset: 0; padding: 14px; flex-direction: column; justify-content: flex-end; gap: 4px;
  font: 400 12px/1.4 var(--font-mono); color: var(--redline);
  background: repeating-linear-gradient(45deg, transparent 0 11px, var(--line) 11px 12px); }
.fig .ph b { font-weight: 500; background: var(--sheet); padding: 2px 6px; align-self: flex-start; overflow-wrap: anywhere; }
.fig.empty img { display: none; }
.fig.empty .ph { display: flex; }
.fig figcaption { font: 400 13px/1.4 var(--font-mono); color: var(--muted); margin-top: 8px; }

/* Project cards */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; }
.card { background: var(--sheet); border: 1px solid var(--line); color: inherit; text-decoration: none; display: flex; flex-direction: column; }
.card:hover { border-color: var(--accent); }
.card .fig .frame { border: 0; border-bottom: 1px solid var(--line); }
.card .body { padding: 16px 18px 18px; display: grid; gap: 8px; }
.card h3 { font-size: 27px; font-weight: 600; }
.card p { font-size: 15.5px; line-height: 1.5; }
.card .more { font: 500 13px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-top: 4px; }
.rows { display: grid; margin-top: 28px; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 6px 20px; align-items: baseline;
  padding: 16px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.row:hover h3 { color: var(--accent); }
.row h3 { font-size: 23px; font-weight: 600; }
.row p { font-size: 15.5px; line-height: 1.5; }
.row .more { font: 500 13px/1 var(--font-mono); color: var(--accent); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } }

/* Experience and skills */
.xp { display: grid; }
.xp-item { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 4px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.xp-item:first-child { border-top: 1px solid var(--line); }
.xp-item .when { font: 400 13px/1.6 var(--font-mono); color: var(--muted); }
.xp-item h3 { font: 600 17px/1.4 var(--font-body); letter-spacing: 0; }
.xp-item .org { color: var(--muted); font-size: 15.5px; }
.xp-item p.what { font-size: 15.5px; margin-top: 4px; max-width: 65ch; }
@media (max-width: 640px) { .xp-item { grid-template-columns: 1fr; } }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.skills h3 { font: 500 13px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.chips li { font: 400 13px/1.3 var(--font-mono); border: 1px solid var(--line); background: var(--sheet); padding: 5px 9px; }

/* Contact */
.contact { display: grid; gap: 14px; }
.contact p { max-width: 60ch; }
.contact dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; margin: 0; font-family: var(--font-mono); font-size: 14.5px; }
.contact dt { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12.5px; padding-top: 2px; }
.contact dd { margin: 0; overflow-wrap: anywhere; }
footer { border-top: 1px solid var(--line); padding: 20px 0 40px; font: 400 12.5px/1.5 var(--font-mono); color: var(--muted); }

/* Project page */
.back { display: inline-block; margin: 28px 0 18px; font: 500 13px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; text-decoration: none; }
.proj h1 { font-size: clamp(38px, 6.5vw, 64px); font-weight: 700; text-transform: uppercase; margin-top: 8px; }
.proj .summary { font-size: 20px; line-height: 1.5; max-width: 60ch; margin: 16px 0 26px; }
.titleblock { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--ink); background: var(--sheet); margin-bottom: 26px; }
.titleblock div { padding: 10px 14px 12px; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.titleblock dt { font: 500 11px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.titleblock dd { margin: 3px 0 0; font: 500 14.5px/1.4 var(--font-mono); }
.proj-body { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 32px; margin: 30px 0 40px; align-items: start; }
@media (max-width: 760px) { .proj-body { grid-template-columns: 1fr; } }
.proj-text { display: grid; gap: 26px; max-width: 65ch; }
.proj-text h2 { font: 500 13px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin-bottom: 8px; }
.proj-text ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.result { border-left: 3px solid var(--accent); padding-left: 16px; font-size: 19px; font-weight: 500; }
.gallery { display: grid; gap: 20px; }
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 20px 0 40px; font: 500 13.5px/1.4 var(--font-mono); }
.pager a { text-decoration: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="draft" id="draft" hidden></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="Sections">
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="home"></div>
  <div id="detail" hidden></div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* =====================================================================
   EDIT HERE. Everything on the site comes from the four lists below.
   You never need to touch the HTML or CSS above.

   How it works:
   - Change the text between the quotes and save. That's it.
   - Anything written as [ADD: ...] shows up in red on the site so you
     can see what's still missing. Replace the whole bracket with real text.
   - Photos: put image files in a folder called "images" next to this file,
     then set image: "images/your-file.jpg". Until a photo exists, the site
     shows a striped placeholder with the file name it's looking for.
   - To add a project: copy one whole { ... } block in PROJECTS, paste it
     below, and give it a new id (lowercase letters, numbers, hyphens only).
   - featured: true puts a project in the big cards at the top. Keep it to 3.
   ===================================================================== */

const PROFILE = {

  email: "[ADD: your email]",
  linkedin: "",          // full URL, e.g. "https://www.linkedin.com/in/your-name"
  resume: "",            // e.g. "Ryan_Osborn_Resume.pdf" placed next to this file
};

const PROJECTS = [
  {
    id: "fsae-dashboard",
    featured: true,
    title: "Formula SAE dashboard redesign",
    org: "Wazzu Racing · Cockpit Controls Team",
    dates: "[ADD: season, e.g. 2025–26]",
    role: "[ADD: your title on the team]",
    team: "[ADD: team size]",
    tools: ["SolidWorks", "[ADD: other tools]"],
    image: "images/fsae-dashboard.jpg",
    summary: "Redesigned the car's dashboard to take up less space and added an LED screen that shows engine data to the driver.",
    problem: "[ADD: what was wrong with the old dashboard? Size, packaging, visibility, driver feedback?]",
    work: [
      "Developed 4 dashboard configurations and compared them [ADD: on what criteria?]",
      "Integrated an LED screen that displays engine data to the driver",
      "[ADD: how it was made — material, process, who you coordinated with]",
    ],
    result: "Smaller dashboard footprint with engine data in the driver's line of sight. [ADD: a number — % smaller, weight saved, parts removed]",
    gallery: [
      { image: "images/fsae-dashboard-cad.jpg", caption: "CAD of the final configuration" },
      { image: "images/fsae-dashboard-car.jpg", caption: "Installed in the car" },
    ],
  },
  {
    id: "putaway-verification",
    featured: true,
    title: "Warehouse put-away verification system",
    org: "ME 415 senior capstone · industry client",
    dates: "Fall 2026 – [ADD: end date]",
    role: "Built the web app prototype; presented test results and demo",
    team: "[ADD: team size]",
    tools: ["QR and barcode labels", "Phone web app", "Spreadsheet backend"],
    image: "images/putaway-app.jpg",
    summary: "A scan-to-shelf check that confirms each package ends up in the right warehouse location, built on a $350 budget.",
    problem: "After touring the client's warehouse, we found two sources of human error in put-away: wrong quantities recorded when material was dropped off after receiving, and no barcode to trace material between receiving and the shelf.",
    work: [
      "Mapped the put-away process on site and picked a software approach that fit the $350 budget",
      "Designed the workflow: scan the package barcode, select the material number, then get prompted to scan the QR code on the destination shelf",
      "Built the web app prototype and tested each version on a phone",
      "Set up printed QR and barcode labels and a spreadsheet backend to log every scan",
    ],
    result: "[ADD: prototype test results — error rate before vs. after, time per put-away, number of trials]",
    gallery: [
      { image: "images/putaway-flow.jpg", caption: "Scan workflow diagram" },
      { image: "images/putaway-test.jpg", caption: "Prototype test at the shelf" },
    ],
  },
  {
    id: "isp-fabrication",
    featured: true,
    title: "Shock physics experiment fabrication",
    org: "WSU Institute for Shock Physics",
    dates: "[ADD: start date] – present",
    role: "[ADD: your job title]",
    team: "[ADD: who you work with]",
    tools: ["[ADD: machines and tools you use]", "[ADD: measurement and inspection tools]"],
    image: "images/isp-fabrication.jpg",
    summary: "I fabricate hardware for shock physics experiments and help set up the diagnostics for each shot.",
    problem: "[ADD: what the experiments need from the parts you make — tolerances, surface finish, turnaround?]",
    work: [
      "Fabricate parts for experiments [ADD: what kinds of parts, what processes]",
      "Set up shot diagnostics [ADD: what you set up and check]",
      "Testing and quality checks on finished parts [ADD: what you measure and to what tolerance]",
    ],
    result: "[ADD: a number — parts made, shots supported, tolerance held, a process you improved]",
    gallery: [
      { image: "images/isp-part.jpg", caption: "[ADD: check with your supervisor what can be shown publicly]" },
    ],
  },
  {
    id: "central-plant-study",
    featured: false,
    title: "Central plant chilled-water and thermal storage study",
    org: "Thermal systems design · team project",
    dates: "Fall 2026",
    role: "Campus load analysis and firm capacity; lead reviewer",
    team: "4",
    tools: ["[ADD: Excel, EES, Python?]"],
    image: "images/central-plant.jpg",
    summary: "Team study of chilled-water and thermal storage options for a campus central plant. I own the load analysis and lead the review of the team's work.",
    problem: "A campus central plant needs to serve its existing buildings plus a new tower. The team is evaluating chiller and thermal storage options against utility rates and life-cycle cost.",
    work: [
      "Built the existing-campus and new-tower cooling load picture the rest of the study depends on",
      "Determined the firm capacity the plant has to provide",

    ],
    result: "[ADD: the recommendation and the numbers behind it once the study is done]",

  },
  {
    id: "flashlight-redesign",
    featured: false,
    title: "Flashlight redesign",
    org: "[ADD: course name]",
    dates: "[ADD: semester]",
    role: "[ADD: your part]",
    team: "[ADD: team size]",
    tools: ["SolidWorks", "FEA"],
    image: "images/flashlight.jpg",
    summary: "Lowest deflection-to-weight ratio of 20 teams.",
    problem: "[ADD: the design brief — loads, limits, what you were optimizing]",
    work: [
      "[ADD: design choices that cut weight without adding deflection]",
      "[ADD: analysis or testing you ran]",
    ],
    result: "Lowest deflection-to-weight ratio out of 20 teams.",
    gallery: [],
  },
  {
    id: "gear-pulley-car",
    featured: false,
    title: "Gear-and-pulley car",
    org: "[ADD: course name]",
    dates: "[ADD: semester]",
    role: "[ADD: your part]",
    team: "[ADD: team size]",
    tools: ["[ADD: tools]"],
    image: "images/gear-pulley-car.jpg",
    summary: "Fastest of 20 teams at 40° and second fastest at 45°.",
    problem: "[ADD: the challenge and its rules]",

      "[ADD: how you built and tuned it]",
    ],
    result: "1st-fastest at 40° and 2nd-fastest at 45° among 20 teams.",
    gallery: [],
  },
];

const EXPERIENCE = [
  { when: "[ADD: dates]", title: "[ADD: job title]", org: "WSU Institute for Shock Physics",
    what: "Fabrication and test support for shock physics experiments, including shot diagnostics setup." },
  { when: "[ADD: dates]", title: "Project Management Intern", org: "Gilbane Development Company",
    what: "Worked on the 451-bed, 14-building South Hill project at the University of Idaho. [ADD: what you owned]" },
  { when: "[ADD: dates]", title: "Cockpit Controls Team", org: "Wazzu Racing Formula SAE",
    what: "Redesigned the dashboard across 4 configurations with an integrated LED engine-data screen." },
  { when: "[ADD: dates]", title: "Engineering mentorship", org: "Boeing",
    what: "[ADD: what you worked on or learned with your mentor]" },
  { when: "[ADD: year]", title: "Eagle Scout, Senior Patrol Leader", org: "Scouting America",
    what: "Led a troop of 40+ scouts and completed 100+ hours of community service." },
];

const SKILLS = [
  { group: "Design", items: ["SolidWorks", "GD&T", "FEA"] },
  { group: "Build and test", items: ["Fabrication", "Data acquisition (DAQ)", "Test setup and diagnostics", "[ADD: machines you run]"] },
  { group: "Analysis", items: ["Heat exchanger design", "Pump and piping selection", "Life-cycle cost", "[ADD: MATLAB, Python, Excel?]"] },
];

/* =====================================================================
   END OF EDITABLE CONTENT. The code below builds the page.
   ===================================================================== */

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rich = s => esc(s).replace(/\[ADD: ?([^\]]*)\]/g, '<mark class="redline">ADD: $1</mark>');
const isTodo = s => !s || /^\[ADD/.test(s);

function figure(src, caption) {
  const empty = !src;
  return `<figure class="fig${empty ? " empty" : ""}">
    <div class="frame">
      ${empty ? "" : `<img src="${esc(src)}" alt="${esc(caption || "")}" onerror="this.closest('.fig').classList.add('empty')">`}
      <div class="ph"><b>Add photo</b>${src ? `<b>${esc(src)}</b>` : ""}</div>
    </div>
    ${caption ? `<figcaption>${rich(caption)}</figcaption>` : ""}
  </figure>`;
}

function linkBtn(label, href, primary) {
  if (isTodo(href)) return `<span class="btn todo">ADD: ${esc(label)}</span>`;
  return `<a class="btn${primary ? " primary" : ""}" href="${esc(href)}">${esc(label)}</a>`;
}

function renderHome() {
  const featured = PROJECTS.filter(p => p.featured);
  const rest = PROJECTS.filter(p => !p.featured);
  const emailHtml = isTodo(PROFILE.email) ? rich(PROFILE.email || "[ADD: your email]")
    : `<a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>`;
  const liHtml = isTodo(PROFILE.linkedin) ? rich("[ADD: LinkedIn URL]")
    : `<a href="${esc(PROFILE.linkedin)}">${esc(PROFILE.linkedin.replace(/^https?:\/\/(www\.)?/, ""))}</a>`;

  return `
  <div class="intro" id="top">
    <p class="eyebrow">${rich(PROFILE.role)} · ${rich(PROFILE.location)}</p>
    <h1>${rich(PROFILE.name)}</h1>
    <p class="lede">${rich(PROFILE.intro)}</p>
    <p class="eyebrow">${rich(PROFILE.status)}</p>
    <div class="links">
      ${linkBtn("Resume", PROFILE.resume, true)}
      ${linkBtn("LinkedIn", PROFILE.linkedin)}
      <a class="btn" href="#contact">Contact</a>
    </div>
  </div>

  <section id="projects">
    <div class="sec-head"><h2>Projects</h2><span>${PROJECTS.length} projects · select one for the full write-up</span></div>
    <div class="grid">
      ${featured.map(p => `
        <a class="card" href="#${esc(p.id)}">
          ${figure(p.image, "")}
          <div class="body">
            <p class="eyebrow">${rich(p.org)}</p>
            <h3>${rich(p.title)}</h3>
            <p>${rich(p.summary)}</p>
            <span class="more">View project →</span>
          </div>
        </a>`).join("")}
    </div>
    ${rest.length ? `<div class="rows">${rest.map(p => `
      <a class="row" href="#${esc(p.id)}">
        <h3>${rich(p.title)}</h3>
        <p>${rich(p.summary)}</p>
        <span class="more">View →</span>
      </a>`).join("")}</div>` : ""}
  </section>

  <section id="experience">
    <div class="sec-head"><h2>Experience</h2></div>
    <div class="xp">
      ${EXPERIENCE.map(x => `
        <div class="xp-item">
          <div class="when">${rich(x.when)}</div>
          <div>
            <h3>${rich(x.title)}</h3>
            <div class="org">${rich(x.org)}</div>
            <p class="what">${rich(x.what)}</p>
          </div>
        </div>`).join("")}
    </div>
  </section>

  <section id="skills">
    <div class="sec-head"><h2>Skills</h2></div>
    <div class="skills">
      ${SKILLS.map(g => `<div><h3>${rich(g.group)}</h3><ul class="chips">${g.items.map(i => `<li>${rich(i)}</li>`).join("")}</ul></div>`).join("")}
    </div>
  </section>

  <section id="contact">
    <div class="sec-head"><h2>Contact</h2></div>
    <div class="contact">
      <p>I'm graduating in May 2027 and looking for entry-level mechanical engineering roles. The Pacific Northwest is home, and I'm open to relocating.</p>
      <dl>
        <dt>Email</dt><dd>${emailHtml}</dd>
        <dt>LinkedIn</dt><dd>${liHtml}</dd>
        <dt>Based in</dt><dd>${rich(PROFILE.location)}</dd>
      </dl>
    </div>
  </section>`;
}

function renderDetail(p) {
  const i = PROJECTS.indexOf(p);
  const prev = PROJECTS[i - 1], next = PROJECTS[i + 1];
  return `
  <article class="proj">
    <a class="back" href="#projects">← All projects</a>
    <p class="eyebrow">${rich(p.org)}</p>
    <h1>${rich(p.title)}</h1>
    <p class="summary">${rich(p.summary)}</p>
    <dl class="titleblock">
      <div><dt>My role</dt><dd>${rich(p.role)}</dd></div>
      <div><dt>Team</dt><dd>${rich(p.team)}</dd></div>
      <div><dt>Dates</dt><dd>${rich(p.dates)}</dd></div>
      <div><dt>Tools</dt><dd>${p.tools.map(rich).join(", ")}</dd></div>
    </dl>
    <div class="proj-body">
      <div class="proj-text">
        <div><h2>Result</h2><p class="result">${rich(p.result)}</p></div>
        <div><h2>The problem</h2><p>${rich(p.problem)}</p></div>
        <div><h2>What I did</h2><ul>${p.work.map(w => `<li>${rich(w)}</li>`).join("")}</ul></div>
      </div>
      <div class="gallery">
        ${figure(p.image, "")}
        ${(p.gallery || []).map(g => figure(g.image, g.caption)).join("")}
      </div>
    </div>
    <nav class="pager" aria-label="More projects">
      ${prev ? `<a href="#${esc(prev.id)}">← ${esc(prev.title)}</a>` : "<span></span>"}
      ${next ? `<a href="#${esc(next.id)}">${esc(next.title)} →</a>` : "<span></span>"}
    </nav>
  </article>`;
}

const home = document.getElementById("home");
const detail = document.getElementById("detail");

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const p = PROJECTS.find(x => x.id === id);
  home.hidden = !!p;
  detail.hidden = !p;
  if (p) {
    detail.innerHTML = renderDetail(p);
    document.title = p.title + " · " + PROFILE.name;
    window.scrollTo(0, 0);
  } else {
    document.title = PROFILE.name + " Portfolio";
    const target = id && document.getElementById(id);
    if (target) target.scrollIntoView();
  }
}

document.getElementById("brand").textContent = PROFILE.name;
document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;
home.innerHTML = renderHome();

const todoCount = (JSON.stringify([PROFILE, PROJECTS, EXPERIENCE, SKILLS]).match(/\[ADD/g) || []).length
  + (PROFILE.linkedin ? 0 : 1) + (PROFILE.resume ? 0 : 1);
if (todoCount) {
  const d = document.getElementById("draft");
  d.hidden = false;
  d.textContent = "Draft: " + todoCount + " items marked in red still need your input. This bar disappears when they're filled in.";
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>

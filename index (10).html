<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan Osborn Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one scrolling page, like an engineering drawing set. Each project is a
   "sheet" with a title bar, photos, and Challenge / Design & Results / Tools & Takeaways. */
:root {
  --paper: #f1f4f7;
  --sheet: #ffffff;
  --ink: #15212c;
  --muted: #586675;
  --line: #c6cfd8;
  --accent: #1d4ed8;
  --redline: #c8102e;
  --redline-bg: #fde8eb;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1a28; --sheet: #142438; --ink: #e6edf4; --muted: #9bafc2;
    --line: #2d4359; --accent: #86b4ff; --redline: #ff8b95; --redline-bg: #3a1a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1a28; --sheet: #142438; --ink: #e6edf4; --muted: #9bafc2;
  --line: #2d4359; --accent: #86b4ff; --redline: #ff8b95; --redline-bg: #3a1a22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--font-body); }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

.draft { background: var(--redline-bg); color: var(--redline); border-bottom: 1px solid var(--redline);
  font: 500 13px/1.4 var(--font-mono); padding: 8px 20px; text-align: center; }
mark.redline { background: var(--redline-bg); color: var(--redline); border-bottom: 1px dashed var(--redline);
  padding: 0 4px; font-family: var(--font-mono); font-size: .86em; }

/* Header */
.top { border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; padding-top: 14px; padding-bottom: 14px; }
.brand { font: 600 22px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.nav { display: flex; flex-wrap: wrap; gap: 4px 20px; font: 500 13px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.nav a { color: var(--muted); text-decoration: none; padding: 6px 0; }
.nav a:hover { color: var(--accent); }

/* Intro */
.intro { padding: 52px 0 40px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 800px) { .intro { grid-template-columns: 1fr; } }
.intro-text { display: grid; gap: 18px; }
.eyebrow { font: 500 13px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.intro h1 { font-size: clamp(48px, 8vw, 84px); font-weight: 700; text-transform: uppercase; }
.contactline { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 14px/1.5 var(--font-mono); color: var(--muted); }
.contactline span + span::before { content: "●"; margin-right: 14px; font-size: 9px; vertical-align: 2px; color: var(--line); }
.bio { max-width: 60ch; font-size: 18.5px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-block; font: 500 14px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase;
  padding: 12px 16px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; background: var(--sheet); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary:hover { background: var(--accent); color: var(--sheet); }
.btn.todo { border: 1px dashed var(--redline); color: var(--redline); background: var(--redline-bg); }

/* Sections */
section { padding: 40px 0; border-top: 1px solid var(--line); }
.sec-head { margin-bottom: 22px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.sec-head h2 { font-size: 36px; font-weight: 600; text-transform: uppercase; }
.sec-head span { font: 400 13px/1.3 var(--font-mono); color: var(--muted); }

/* Interests */
.interests { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.interests li { display: grid; grid-template-columns: 36px minmax(0, 1fr); padding: 12px 0; border-bottom: 1px solid var(--line); }
.interests li b { font: 500 13px/1.7 var(--font-mono); color: var(--accent); }

/* Figures */
.fig { margin: 0; }
.fig .frame { aspect-ratio: 4 / 3; border: 1px solid var(--line); background: var(--sheet); overflow: hidden; position: relative; }
.fig img { width: 100%; height: 100%; object-fit: cover; }
.fig .ph { display: none; position: absolute; inset: 0; padding: 14px; flex-direction: column; justify-content: flex-end; gap: 4px;
  font: 400 12px/1.4 var(--font-mono); color: var(--redline);
  background: repeating-linear-gradient(45deg, transparent 0 11px, var(--line) 11px 12px); }
.fig .ph b { font-weight: 500; background: var(--sheet); padding: 2px 6px; align-self: flex-start; overflow-wrap: anywhere; }
.fig.wide { grid-column: 1 / -1; }
.fig.contain .frame { aspect-ratio: 9 / 16; }
.fig.contain img { object-fit: contain; }
.fig.wide .frame { aspect-ratio: auto; }
.fig.wide img { height: auto; }
.fig.wide.empty .frame { aspect-ratio: 3 / 1; }
.intro > .fig .frame { aspect-ratio: 1 / 1; max-width: 340px; margin-left: auto; }
.intro > .fig .frame img { object-position: center top; }
.fig.empty img { display: none; }
.fig.empty .ph { display: flex; }
.fig figcaption { font: 400 13px/1.45 var(--font-mono); color: var(--muted); margin-top: 8px; }

/* Project sheets */
.projects { display: grid; gap: 28px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); }
.sheet-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 16px 22px; border-bottom: 1px solid var(--ink); }
.sheet-head .num { font: 500 13px/1 var(--font-mono); color: var(--accent); }
.sheet-head h3 { font-size: 30px; font-weight: 600; }
.sheet-head .org { font: 400 14px/1.4 var(--font-mono); color: var(--muted); }
.sheet-head .org::before { content: "●"; margin-right: 10px; font-size: 9px; vertical-align: 2px; color: var(--line); }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 26px; padding: 22px; }
@media (max-width: 800px) { .sheet-body { grid-template-columns: 1fr; } }
.photos { display: grid; gap: 16px; align-content: start; }
.photos.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 500px) { .photos.two { grid-template-columns: 1fr; } }
.detail { display: grid; gap: 20px; align-content: start; }
.detail h4 { margin: 0 0 6px; font: 500 12.5px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.challenge { font-size: 17.5px; }
.detail li { font-size: 16px; line-height: 1.5; }
.takeaways { border-top: 1px dashed var(--line); padding-top: 16px; }
.takeaways ul { list-style: none; padding: 0; }
.takeaways li b { font-weight: 600; }

/* Skills */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 22px; }
.skills h3 { font: 500 13px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.chips li { font: 400 13px/1.3 var(--font-mono); border: 1px solid var(--line); background: var(--sheet); padding: 5px 9px; }

/* Contact */
.contact { display: grid; gap: 14px; }
.contact p { max-width: 60ch; }
.contact dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; margin: 0; font-family: var(--font-mono); font-size: 14.5px; }
.contact dt { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12.5px; padding-top: 2px; }
.contact dd { margin: 0; overflow-wrap: anywhere; }
footer { border-top: 1px solid var(--line); padding: 20px 0 40px; font: 400 12.5px/1.5 var(--font-mono); color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>

<div class="draft" id="draft" hidden></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="Sections">
      <a href="#interests">Interests</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>

</header>
<main class="wrap" id="page"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* =====================================================================

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rich = s => esc(s).replace(/\[ADD: ?([^\]]*)\]/g, '<mark class="redline">ADD: $1</mark>');
const isTodo = s => !s || /^\[ADD/.test(s);
const pad = n => String(n).padStart(2, "0");

function figure(src, caption, wide, fit) {
  const empty = !src;
  return `<figure class="fig${empty ? " empty" : ""}${wide ? " wide" : ""}${fit === "contain" ? " contain" : ""}">
    <div class="frame">
      ${empty ? "" : `<img src="${esc(src)}" alt="${esc(String(caption || "").replace(/\[ADD[^\]]*\]/g, ""))}" onerror="this.closest('.fig').classList.add('empty')">`}
      <div class="ph"><b>Add photo</b>${src ? `<b>${esc(src)}</b>` : ""}</div>
    </div>
    ${caption ? `<figcaption>${rich(caption)}</figcaption>` : ""}
  </figure>`;
}

function linkBtn(label, href, primary) {
  if (isTodo(href)) return `<span class="btn todo">ADD: ${esc(label)}</span>`;
  return `<a class="btn${primary ? " primary" : ""}" href="${esc(href)}">${esc(label)}</a>`;
}

function render() {
  const P = PROFILE;

  return `

    <div class="intro-text">
      <p class="eyebrow">${rich(P.title)}</p>
      <h1>${rich(P.name)}</h1>
      <p class="bio">${rich(P.bio)}</p>
      <div class="links">
        ${linkBtn("Resume", P.resume, true)}
        ${linkBtn("LinkedIn", P.linkedin)}
        <a class="btn" href="#projects">See projects</a>
      </div>
    </div>
    ${figure(P.heroImage, P.heroCaption)}
  </div>

  <section id="interests">
    <div class="sec-head"><h2>Engineering interests</h2></div>
    <ul class="interests">
      ${INTERESTS.map((x, i) => `<li><b>${pad(i + 1)}</b><span>${rich(x)}</span></li>`).join("")}
    </ul>
  </section>

  <section id="projects">
    <div class="sec-head"><h2>Engineering projects</h2><span>${PROJECTS.length} projects</span></div>
    <div class="projects">
      ${PROJECTS.map((p, i) => `
      <article class="sheet">
        <div class="sheet-head">
          <span class="num">${pad(i + 1)}</span>
          <h3>${rich(p.title)}</h3>
          <span class="org">${rich(p.org)}</span>
        </div>
        <div class="sheet-body">
          <div class="photos${(p.images || []).length > 1 ? " two" : ""}">
            ${(p.images || []).map(im => figure(im.src, im.caption, im.wide, im.fit)).join("")}
          </div>
          <div class="detail">
            <div><h4>Challenge</h4><p class="challenge">${rich(p.challenge)}</p></div>
            <div><h4>Design &amp; results</h4><ul>${p.results.map(r => `<li>${rich(r)}</li>`).join("")}</ul></div>
            <div class="takeaways"><h4>Tools &amp; takeaways</h4>
              <ul>
                <li><b>Tools:</b> ${rich(p.tools)}</li>
                <li><b>Next time:</b> ${rich(p.nextTime)}</li>
              </ul>
            </div>
          </div>
        </div>
      </article>`).join("")}
    </div>
  </section>

  <section id="skills">
    <div class="sec-head"><h2>Skills</h2></div>
    <div class="skills">
      ${SKILLS.map(g => `<div><h3>${rich(g.group)}</h3><ul class="chips">${g.items.map(i => `<li>${rich(i)}</li>`).join("")}</ul></div>`).join("")}
    </div>
  </section>
`;
}

document.getElementById("brand").textContent = PROFILE.name;
document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;
document.getElementById("page").innerHTML = render();

const todoCount = (JSON.stringify([PROFILE, INTERESTS, PROJECTS, SKILLS]).match(/\[ADD/g) || []).length
  + (PROFILE.linkedin ? 0 : 1) + (PROFILE.resume ? 0 : 1);
if (todoCount) {
  const d = document.getElementById("draft");
  d.hidden = false;
  d.textContent = "Draft: " + todoCount + " items marked in red still need your input. This bar disappears when they're filled in.";
}
</script>
</body>
</html>
